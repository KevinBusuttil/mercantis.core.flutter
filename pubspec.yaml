name: mercantis_core_mono
description: Mercantis Core Flutter monorepo root.
repository: https://github.com/KevinBusuttil/mercantis.core.flutter
publish_to: none

environment:
  sdk: '>=3.6.0 <4.0.0'

# Dart pub workspace — `flutter pub get` here resolves all member packages.
workspace:
  - packages/mercantis_core
  - packages/mercantis_core_ui
  - app

dev_dependencies:
  melos: ^7.0.0

# Melos 7+ reads its config from here (the standalone melos.yaml is no longer
# used). Package discovery comes from the `workspace:` list above.
melos:
  scripts:
    test:
      run: melos exec -- dart test
      description: Run all tests (pure Dart packages)
    flutter_test:
      run: melos exec --flutter -- flutter test
      description: Run flutter widget tests for Flutter packages
    analyze:
      run: melos exec -- dart analyze
      description: Analyze all packages
    format:
      run: melos exec -- dart format .
      description: Format all packages
    check_no_hub_leakage:
      run: tool/check_no_hub_leakage.sh
      description: Fail if Hub-specific identifiers leak into Core
