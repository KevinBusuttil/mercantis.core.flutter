name: mercantis_core_ui
description: Metadata-driven Flutter UI shell for the Mercantis ecosystem.
version: 0.1.0
repository: https://github.com/KevinBusuttil/mercantis.core.flutter
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  mercantis_core:
    path: ../mercantis_core
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.4
  path_provider: ^2.1.3
  file_picker: ^8.0.0
  shared_preferences: ^2.2.0
  intl: ^0.19.0
  printing: ^5.12.0
  barcode_widget: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
